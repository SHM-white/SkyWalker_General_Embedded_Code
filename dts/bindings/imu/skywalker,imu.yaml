# SPDX-License-Identifier: Apache-2.0

description: Skywalker IMU

compatible: "skywalker,imu"

include: [base.yaml]

properties:
  accel-dev:
    type: phandle
    required: true
    description: 加速度计设备节点
  gyro-dev:
    type: phandle
    required: true
    description: 陀螺仪设备节点
  heat-dev:
    type: phandle
    required: true
    description: PWM 加热设备节点
  filter-dev:
    type: phandle
    required: true
    description: 解算滤波器设备节点（kalman_filter 等）
  heat-kp:
    type: string
    required: true
  heat-ki:
    type: string
    required: true
  heat-kd:
    type: string
    required: true
  heat-integral-max:
    type: string
    required: true
  heat-output-max:
    type: string
    required: true
  heat-deadband:
    type: string
    required: true
  heat-derivative-tau-s:
    type: string
    required: true
  heat-dt-min-s:
    type: string
    required: true
  heat-dt-max-s:
    type: string
    required: true
  heat-feedforward-ns:
    type: string
    required: true
  estimator:
    type: string
    required: true
    enum:
      - "ekf"
    description: 解算方法选择
