name: Publish development container

on:
  push:
    paths:
      - 'west.yml'
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yml'
  pull_request:
    paths:
      - 'west.yml'
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Resolve versioned image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-dev:$(bash .devcontainer/image-tag.sh)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          expected=$(python3 -c 'import json; print(json.load(open(".devcontainer/devcontainer.json"))["image"])')
          if [[ "$image" != "$expected" ]]; then
            echo "Update devcontainer.json image to: $image" >&2
            exit 1
          fi
      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.image }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=skywalker-devcontainer
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=skywalker-devcontainer' || '' }}
      - name: Record pull command
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          printf '### Development image\n\n`docker pull %s`\n\nFirst publication defaults to private. Authenticate to GHCR before opening the container, or change the package visibility to public in GitHub Packages.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
