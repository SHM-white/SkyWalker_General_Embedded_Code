name: Unit tests

on:
  push:
    paths:
      - 'tests/**'
      - 'include/**'
      - 'lib/**'
      - 'drivers/**'
      - 'boards/**'
      - 'dts/**'
      - 'zephyr/**'
      - 'west.yml'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - '.github/workflows/unit-tests.yml'
      - '.github/ci/zephyr-native.Dockerfile'
      - '.github/ci/link-prebuilt-workspace.sh'
  pull_request:
    paths:
      - 'tests/**'
      - 'include/**'
      - 'lib/**'
      - 'drivers/**'
      - 'boards/**'
      - 'dts/**'
      - 'zephyr/**'
      - 'west.yml'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - '.github/workflows/unit-tests.yml'
      - '.github/ci/zephyr-native.Dockerfile'
      - '.github/ci/link-prebuilt-workspace.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-image:
    name: Resolve prebuilt Zephyr CI image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: skywalker_code
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve content-addressed image
        id: image
        run: |
          set -euo pipefail
          digest=$(sha256sum skywalker_code/west.yml skywalker_code/.github/ci/zephyr-native.Dockerfile | sha256sum | cut -c1-20)
          image="ghcr.io/shm-white/skywalker-zephyr-native-ci:$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse first-time publication from a fork
        if: steps.image.outputs.present != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Pinned image missing. First publish it from a trusted branch.' >&2
          exit 1
      - name: Configure Buildx
        if: steps.image.outputs.present != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and publish missing Zephyr image
        if: steps.image.outputs.present != 'true'
        uses: docker/build-push-action@v6
        with:
          context: skywalker_code
          file: skywalker_code/.github/ci/zephyr-native.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=skywalker-zephyr-native
          cache-to: type=gha,mode=max,scope=skywalker-zephyr-native

  native-unit-tests:
    needs: prepare-image
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    name: Unit tests (native_sim 64-bit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZEPHYR_BASE: ${{ github.workspace }}/zephyr
      ZEPHYR_TOOLCHAIN_VARIANT: host/gnu
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Match manifest.self.path in west.yml.
          path: skywalker_code

      - name: Link prebuilt Zephyr workspace
        run: |
          set -euo pipefail
          bash skywalker_code/.github/ci/link-prebuilt-workspace.sh

      - name: Build and run unit tests
        run: |
          set -euo pipefail
          # Twister recursively discovers every testcase.yaml under tests.
          west twister \
            -T skywalker_code/tests \
            -p native_sim/native/64 \
            --inline-logs \
            --jobs 2 \
            -O build/unit-tests

      - name: Summarize results and timings
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path('build/unit-tests')
          report = output / 'twister.json'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## Unit tests\n\n')
              if report.exists():
                  suites = json.loads(report.read_text()).get('testsuites', [])
                  summary.write('| Suite | Status | Passed | Total |\n')
                  summary.write('| --- | --- | ---: | ---: |\n')
                  for suite in suites:
                      cases = suite.get('testcases', [])
                      passed = sum(case.get('status') == 'passed' for case in cases)
                      summary.write(
                          f"| {suite['name']} | {suite.get('status', 'unknown')} "
                          f"| {passed} | {len(cases)} |\n"
                      )
              else:
                  summary.write('No Twister report was generated. See the setup and test step logs.\n')

              timings = []
              for log in sorted(output.rglob('handler.log')):
                  timings.extend(line for line in log.read_text(errors='replace').splitlines()
                                 if line.startswith('BENCH '))
              if timings:
                  summary.write('\n### Algorithm timings\n\n')
                  summary.write('Host execution time; batch min/max are batch means.\n\n')
                  summary.write('```text\n' + '\n'.join(timings) + '\n```\n')
          PY

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-native-sim-64
          path: |
            build/unit-tests/*.json
            build/unit-tests/*.xml
            build/unit-tests/*.log
            build/unit-tests/**/build.log
            build/unit-tests/**/handler.log
          if-no-files-found: warn
          retention-days: 14
