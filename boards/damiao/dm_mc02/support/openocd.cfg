# Horco wireless DAPLink enumerates as a CMSIS-DAP adapter.  Leave the
# backend on "auto" so OpenOCD can prefer CMSIS-DAP v2 bulk and fall back to
# CMSIS-DAP v1 HID when required by the adapter firmware.
source [find interface/cmsis-dap.cfg]

transport select swd

source [find target/stm32h7x.cfg]

# Start conservatively for the wireless link.  This can be raised after the
# connection is known to be stable.
adapter speed 1000
