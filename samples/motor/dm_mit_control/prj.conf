CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CAN=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=8192

# Keep the debug connection alive when k_sleep() lets the CPU idle.
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

CONFIG_SKYWALKER_LIB_VOFA=y
CONFIG_UART_ASYNC_API=y
CONFIG_SKYWALKER_DRIVER_MOTOR=y
CONFIG_SKYWALKER_MOTOR_DM=y
CONFIG_SKYWALKER_DM_FEEDBACK_TIMEOUT_MS=50
CONFIG_SKYWALKER_DM_COMMAND_TIMEOUT_MS=20
