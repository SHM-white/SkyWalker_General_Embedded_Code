# AB vision receiver for the dual-Yaw gimbal.
# The board overlay must also provide a `vision-uart` alias; without it the
# application compiles the vision path out and only manual control remains.
# Arbitration still needs `vehicle::vision_execute_confirmed` set after the
# vision attitude/reference chain has been verified.
CONFIG_SKYWALKER_VISION=y
CONFIG_SKYWALKER_VISION_AB=y
CONFIG_SKYWALKER_VISION_RECEIVER=y
