# Fixed manual application; select a different source directory for bring-up.
# Enable the status LED only in apps which actually use it.
CONFIG_SKYWALKER_STATUS_LED=y
CONFIG_SKYWALKER_DRIVER_MOTOR=y
CONFIG_SKYWALKER_MOTOR_DJI=y
CONFIG_SKYWALKER_MOTOR_DM=y
CONFIG_SKYWALKER_LIB_CONTROL=y
CONFIG_SKYWALKER_LIB_MOTOR_CONTROL=y
CONFIG_SKYWALKER_LIB_COMMUNICATION=y
CONFIG_SKYWALKER_UART_TRANSPORT=y
CONFIG_SKYWALKER_INTERBOARD_ENDPOINT=y
CONFIG_SKYWALKER_LIB_ROBOTICS=y
CONFIG_SKYWALKER_REMOTE_DR16=y
CONFIG_SKYWALKER_REMOTE_RECEIVER=y
CONFIG_SKYWALKER_NAVIGATION_RECEIVER=y
CONFIG_SKYWALKER_ROBOTICS_COMMAND=y
CONFIG_SKYWALKER_COMMAND_SERVICE=y
CONFIG_SKYWALKER_ROBOTICS_GIMBAL=y
CONFIG_SKYWALKER_ROBOTICS_INERTIAL_GIMBAL=y
CONFIG_SKYWALKER_ROBOTICS_BIG_YAW=y
CONFIG_SKYWALKER_IMU_RECEIVER=y
# 视觉链路：USB CDC ACM（板载 usbotg_hs，PA11/PA12），AB 协议在云台板内解析。
# 是否允许仲裁选用视觉仍由 vehicle::vision_execute_confirmed 决定。
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="SkyWalker Vision"
CONFIG_SKYWALKER_VISION=y
CONFIG_SKYWALKER_VISION_AB=y
CONFIG_SKYWALKER_VISION_RECEIVER=y
# 大 Yaw 载体板载 BMI088；手动编码器闭环不启动 CAN3 外置 IMU。
CONFIG_SENSOR=y
CONFIG_BMI08X=y
CONFIG_SKYWALKER_IMU_BMI088=y
CONFIG_SKYWALKER_ATTITUDE_EKF=y
