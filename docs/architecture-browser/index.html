  <script>
    (() => {
      let theme = 'system', layout = 'auto';
      try {
        theme = localStorage.getItem('skywalker-doc-theme') || 'system';
        layout = localStorage.getItem('skywalker-code-layout') || 'auto';
      } catch {}
      if (!['system', 'light', 'dark'].includes(theme)) theme = 'system';
      if (!['auto', 'wrap', 'scroll'].includes(layout)) layout = 'auto';
      document.documentElement.dataset.theme = theme === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
      document.documentElement.dataset.codeLayout = layout === 'auto'
        ? (matchMedia('(max-width: 760px)').matches ? 'wrap' : 'scroll') : layout;
    })();
  </script>
